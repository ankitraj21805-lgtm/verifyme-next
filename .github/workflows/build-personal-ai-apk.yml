name: Build Personal AI Assistant APK

on:
  pull_request:
    branches: [main]
    paths:
      - 'apk-build-source/**'
      - '.github/workflows/build-personal-ai-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Decode Android project ZIP
        run: |
          mkdir -p apk-build-workspace
          base64 -d apk-build-source/PersonalAIAssistant_Live_Ready.zip.b64 > apk-build-workspace/project.zip
          unzip -q apk-build-workspace/project.zip -d apk-build-workspace

      - name: Build debug APK
        working-directory: apk-build-workspace/personal_ai_assistant_live_ready
        run: |
          gradle :app:assembleDebug --no-daemon -PASSISTANT_PROXY_BASE_URL=https://verifyme-next-ankitraj21805-lgtms-projects.vercel.app/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PersonalAIAssistant-debug-apk
          path: apk-build-workspace/personal_ai_assistant_live_ready/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
